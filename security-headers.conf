# Included from every location in nginx.conf (add_header is not inherited once a
# location sets its own). __API_ORIGIN__ is replaced at image build time from
# VITE_API_URL — the same value the bundle calls — so connect-src allows exactly
# that API and nothing else.
#
# - script-src 'self': no inline or remote scripts, so injected markup can't run
#   code that reads the token in localStorage.
# - style-src 'unsafe-inline': React sets style="" attributes (chart bars, seal).
# - font/style hosts: Google Fonts only (see index.html).
# - img-src data:/blob: : logos are data URIs, receipts open as blob URLs.
# - frame-src/object-src blob: : the invoice PDF preview is a blob in an iframe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' __API_ORIGIN__; frame-src blob:; object-src blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
