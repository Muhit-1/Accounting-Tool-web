server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # Behind Traefik; without this nginx skips compression for proxied requests.
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # nginx's add_header is NOT additive: a location that declares any add_header
  # discards every header inherited from the server level. So the security
  # headers are repeated in each location below that sets Cache-Control.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Hashed build output: the filename changes whenever the content does, so it
  # can be cached forever. A missing file must 404 — not fall back to
  # index.html, which a stale tab would then try to run as JavaScript.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # The app shell is not hashed and points at the current hashed bundles, so it
  # must be revalidated on every load or users keep an old release.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Client-side routing: unknown paths must serve the app shell (which then
  # matches the location above via the internal redirect to /index.html).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
